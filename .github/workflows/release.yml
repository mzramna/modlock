name: Build mod jars on release

# Two ways to release (both build + test both Minecraft versions and attach their jars):
#  - publish a GitHub release (any tag)
#  - push to the `release` branch: the release v<mod_version> (gradle.properties) is created automatically
on:
  release:
    types: [published]
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release (push to release branch)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

  build:
    needs: prepare
    name: Build ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: "1.21.1"
            java: "21"
          - branch: "26.1"
            java: "25"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: GameTests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Upload jar as release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/libs/modlock-*.jar
          file_glob: true
          tag: ${{ needs.prepare.outputs.tag }}
          overwrite: true
