name: Build mod jars on release

on:
  release:
    types: [published]

jobs:
  build-1.21.1:
    name: Build 1.21.1 (NeoForge 21.1.145)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 1.21.1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: GameTests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Upload jar as release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/libs/modlock-1.21.1-*.jar
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true

  build-26.1.2:
    name: Build 26.1.2 (NeoForge 26.1.x)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: 26.1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: GameTests
        run: ./gradlew runGameTestServer --no-daemon

      - name: Upload jar as release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/libs/modlock-26.1.2-*.jar
          tag: ${{ github.ref }}
          file_glob: true
          overwrite: true
